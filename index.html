<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Колесо путешествий — Виктория Герасимова</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  padding: 28px 16px 45px;
  font-family: 'Nunito Sans', sans-serif;
  color: #24464b;
  text-align: center;
  background: transparent;
  position: relative;
  isolation: isolate;
}

/* Рисованный фон: море, морская пена и песок */
.sea-background {
  position: fixed;
  inset: 0;
  z-index: -1;
  overflow: hidden;
  pointer-events: none;
  background: linear-gradient(
    180deg,
    #b4d0d8 0%,
    #c2d9dc 42%,
    #d5e2df 76%,
    #e5dcc8 100%
  );
}

.sea-background svg {
  width: 100%;
  height: 100%;
  display: block;
}

/* Лёгкая песочная текстура */
.sand-texture {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  height: 24%;
  opacity: .22;
  background-image:
    radial-gradient(#ad9876 0.7px, transparent 0.9px),
    radial-gradient(#fff8e9 0.8px, transparent 1px);
  background-size: 19px 21px, 27px 25px;
  background-position: 0 0, 9px 12px;
  mask-image: linear-gradient(to bottom, transparent, #000 35%);
}

header {
  margin-bottom: 24px;
}

header h1 {
  font-size: 27px;
  font-weight: 800;
  margin: 8px 0;
  color: #24666a;
}

header p {
  margin: 0;
  color: #668184;
  font-size: 16px;
}

.decor {
  font-size: 30px;
  letter-spacing: 9px;
}

.card {
  max-width: 540px;
  margin: 0 auto;
  padding: 26px 20px;
  background: #ffffff;
  border-radius: 24px;
  box-shadow: 0 12px 35px #24464b16;
}

h2 {
  color: #24666a;
  margin: 0 0 12px;
  font-weight: 800;
}

#welcome {
  font-size: 23px;
  font-weight: 800;
  margin: 18px 0 8px;
}

#instruction {
  color: #71878a;
  line-height: 1.5;
  font-size: 16px;
}

.wheel-wrap {
  width: min(100%, 390px);
  aspect-ratio: 1;
  position: relative;
  margin: 25px auto;
}

canvas {
  display: block;
  width: 100%;
  height: 100%;
  border-radius: 50%;
  transition: transform 5s cubic-bezier(.12,.75,.12,1);
  filter: drop-shadow(0 7px 8px #24464b25);
}

.pointer {
  position: absolute;
  z-index: 2;
  top: -9px;
  left: 50%;
  transform: translateX(-50%);
  width: 0;
  height: 0;
  border-left: 17px solid transparent;
  border-right: 17px solid transparent;
  border-top: 34px solid #d58b43;
  filter: drop-shadow(0 2px 2px #0002);
}

.center {
  position: absolute;
  z-index: 1;
  width: 66px;
  height: 66px;
  border-radius: 50%;
  background: #fff;
  border: 7px solid #e5bd7c;
  top: 50%;
  left: 50%;
  transform: translate(-50%,-50%);
  box-shadow: 0 2px 8px #0002;
  transition: opacity .3s ease;
}

.center.loading {
  opacity: 0;
}

/* Фиолетовая кнопка — прежняя форма и анимация */
button {
  display: block;
  width: min(100%, 340px);
  margin: 24px auto 10px;
  padding: 21px 30px;
  border: 0;
  border-radius: 18px;
  color: #fff;
  background: linear-gradient(135deg, #aa8bd8, #8967c5);
  font-family: 'Nunito Sans', sans-serif;
  font-size: 22px;
  font-weight: 900;
  letter-spacing: 0.3px;
  cursor: pointer;
  box-shadow: 0 7px 0 #7052a5, 0 10px 20px #8967c540;
  transition: transform .2s ease, box-shadow .2s ease, opacity .2s ease;
}

button:not(:disabled):hover {
  transform: translateY(-2px);
  box-shadow: 0 9px 0 #7052a5, 0 13px 24px #8967c540;
}

button:not(:disabled):active {
  transform: translateY(4px);
  box-shadow: 0 3px 0 #7052a5, 0 5px 12px #8967c540;
}

button:disabled {
  opacity: .65;
  cursor: not-allowed;
}

#result {
  display: none;
  margin: 22px 0 8px;
  padding: 20px;
  border-radius: 16px;
  background: #f1f8f3;
}

#result h2 {
  font-size: 25px;
}

#prizeName {
  font-size: 23px;
  font-weight: 900;
  color: #b87936;
}

#prizeDescription {
  color: #668184;
  margin-top: 8px;
  font-size: 16px;
}

#message {
  margin: 15px 0;
  color: #a34242;
  line-height: 1.5;
}

.thanks {
  margin-top: 22px;
  color: #668184;
}

footer {
  margin-top: 22px;
  font-size: 13px;
  color: #8a9c9b;
}

@media(max-width:420px) {
  header h1 {
    font-size: 23px;
  }

  .card {
    padding: 22px 14px;
  }

  button {
    font-size: 21px;
    padding: 20px 22px;
  }
}
</style>
</head>

<header>

<script>
const SUPABASE_URL = 'https://qvlxuzvltcqjxlsqboip.supabase.co';
const SUPABASE_KEY = 'sb_publishable_yQycydwZXHu69680pGjhMg_kvKvsrGo';

const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const colors = [
  '#D8EAE2',
  '#F5DDD5',
  '#E4DDF0',
  '#F5EACD',
  '#D9E6F2',
  '#EBDCE8',
  '#DCE8D1',
  '#F2E0C5',
  '#D5E8E8',
  '#E9DCE0'
];

const canvas = document.getElementById('wheel');
const ctx = canvas.getContext('2d');
const button = document.getElementById('spinButton');
const message = document.getElementById('message');
const result = document.getElementById('result');
const center = document.querySelector('.center');

const token = new URLSearchParams(location.search).get('token');

let participantName = '';
let prizes = [];
let busy = false;

/* Получение значения из объекта */
function getField(item, ...keys) {
  for (const key of keys) {
    if (item && item[key] !== undefined && item[key] !== null) {
      return item[key];
    }
  }
  return '';
}

/* Название сектора берётся напрямую из админки */
function getWheelLabel(prize) {
  return {
    name: String(prize.name || '').trim(),
    emoji: prize.emoji || '🎁'
  };
}

function normalizePrize(item) {
  return {
    name: String(getField(item, 'name', 'prize_name')),
    description: String(getField(item, 'description', 'prize_description')),
    emoji: String(getField(item, 'emoji', 'prize_emoji') || '🎁')
  };
}

/* Перенос названий только по целым словам */
function wrapCanvasText(text, fontSize, maxWidth) {
  const words = text.split(/\s+/).filter(Boolean);
  let fittedFontSize = fontSize;

  ctx.font = `900 ${fittedFontSize}px "Nunito Sans", sans-serif`;

  const longestWordWidth = Math.max(
    0,
    ...words.map(word => ctx.measureText(word).width)
  );

  if (longestWordWidth > maxWidth) {
    fittedFontSize = Math.max(
      7,
      Math.floor(fittedFontSize * maxWidth / longestWordWidth * 0.98)
    );
  }

  ctx.font = `900 ${fittedFontSize}px "Nunito Sans", sans-serif`;

  const lines = [];
  let currentLine = '';

  for (const word of words) {
    const testLine = currentLine
      ? currentLine + ' ' + word
      : word;

    if (ctx.measureText(testLine).width <= maxWidth) {
      currentLine = testLine;
    } else {
      if (currentLine) {
        lines.push(currentLine);
      }

      currentLine = word;
    }
  }

  if (currentLine) {
    lines.push(currentLine);
  }

  return {
    lines,
    fontSize: fittedFontSize
  };
}

function drawWheel() {
  const cx = 300, cy = 300, radius = 285;

  ctx.clearRect(0, 0, 600, 600);

  if (!prizes.length) {
    center.classList.add('loading');

    ctx.beginPath();
    ctx.arc(cx, cy, radius, 0, Math.PI * 2);
    ctx.fillStyle = '#e8f1ef';
    ctx.fill();

    ctx.fillStyle = '#668184';
    ctx.textAlign = 'center';
    ctx.font = '700 20px "Nunito Sans", sans-serif';
    ctx.fillText('Подарки загружаются', cx, cy);

    return;
  }

  const angle = Math.PI * 2 / prizes.length;

  prizes.forEach((prize, i) => {
    const start = -Math.PI / 2 + i * angle;
    const end = start + angle;

    /* Рисуем сектор */
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.arc(cx, cy, radius, start, end);
    ctx.closePath();

    ctx.fillStyle = colors[i % colors.length];
    ctx.fill();

    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 5;
    ctx.stroke();

    const middle = start + angle / 2;
    const labelRadius = prizes.length <= 5 ? 178 : 190;
    const x = cx + Math.cos(middle) * labelRadius;
    const y = cy + Math.sin(middle) * labelRadius;

    const label = getWheelLabel(prize);

    ctx.save();

    /*
      Поворачиваем систему координат подписи относительно центра.
      Верх букв направлен к внешнему краю колеса,
      низ букв — к центру.
      При вращении колеса надписи вращаются вместе с ним.
    */
    ctx.translate(x, y);
    ctx.rotate(middle + Math.PI / 2);

    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    const emojiSize = prizes.length > 8 ? 26 : 32;
    const baseTextSize = prizes.length > 8 ? 17 : (prizes.length > 6 ? 19 : 22);
    const maxWidth = prizes.length > 7 ? 110 : 135;
    const maxLines = 3;

    let layout = wrapCanvasText(label.name, baseTextSize, maxWidth);

    while (layout.lines.length > maxLines && layout.fontSize > 12) {
      layout = wrapCanvasText(label.name, layout.fontSize - 1, maxWidth);
    }

    const fontSize = layout.fontSize;
    const lines = layout.lines;

    const totalHeight = lines.length * fontSize * 1.05;
    const lineHeight = fontSize * 1.05;

    const startY = 13 - totalHeight / 2;

    /* Эмодзи находится ближе к внешнему краю сектора */
    ctx.fillStyle = '#29464a';
    ctx.font = `${emojiSize}px Arial`;
    ctx.fillText(label.emoji, 0, startY - emojiSize * 0.9);

    /* Название подарка */
    ctx.fillStyle = '#29464a';
    ctx.font = `900 ${fontSize}px "Nunito Sans", sans-serif`;

    lines.forEach((line, index) => {
      ctx.fillText(line, 0, startY + index * lineHeight);
    });

    ctx.restore();
  });

  /* Внешняя обводка колеса */
  ctx.beginPath();
  ctx.arc(cx, cy, radius, 0, Math.PI * 2);
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 7;
  ctx.stroke();
}

function showPrize(prizeName, description) {
  document.getElementById('prizeName').textContent = prizeName || 'Ваш подарок';
  document.getElementById('prizeDescription').textContent = description || '';

  result.style.display = 'block';

  button.disabled = true;
  button.textContent = 'Подарок уже получен';

  document.getElementById('instruction').textContent =
    'Ваш сюрприз уже определён. Спасибо за участие!';
}

async function loadWheelPrizes() {
  const { data, error } = await db.rpc('get_wheel_prizes');

  if (error) {
    console.error('Ошибка загрузки подарков:', error);
    throw new Error('Не удалось загрузить список подарков. Обновите страницу или обратитесь к Виктории.');
  }

  let list = data;

  if (typeof list === 'string') {
    try {
      list = JSON.parse(list);
    } catch {
      list = [];
    }
  }

  if (!Array.isArray(list)) {
    throw new Error('Список подарков пришёл в неожиданном формате. Обратитесь к Виктории.');
  }

  prizes = list.map(normalizePrize).filter(prize => prize.name);

  if (!prizes.length) {
    throw new Error('Пока нет активных подарков. Обратитесь к Виктории.');
  }

  await document.fonts.load('900 22px "Nunito Sans"');

  center.classList.remove('loading');

  drawWheel();
}

function findPrizeIndex(data) {
  const prizeName = String(data.prize || '').trim().toLocaleLowerCase('ru');
  const description = String(data.description || '').trim().toLocaleLowerCase('ru');
  const emoji = String(data.emoji || '').trim();

  let index = prizes.findIndex(prize =>
    prize.name.trim().toLocaleLowerCase('ru') === prizeName &&
    prize.description.trim().toLocaleLowerCase('ru') === description
  );

  if (index < 0 && emoji) {
    index = prizes.findIndex(prize =>
      prize.name.trim().toLocaleLowerCase('ru') === prizeName &&
      prize.emoji === emoji
    );
  }

  if (index < 0) {
    index = prizes.findIndex(prize =>
      prize.name.trim().toLocaleLowerCase('ru') === prizeName
    );
  }

  return index;
}

async function loadParticipant() {
  if (!token) {
    message.textContent = 'Персональная ссылка не найдена. Пожалуйста, обратитесь к Виктории за вашей ссылкой.';
    button.textContent = 'Нет персональной ссылки';
    return;
  }

  try {
    await loadWheelPrizes();
  } catch (error) {
    message.textContent = error.message;
    button.textContent = 'Не удалось загрузить подарки';
    return;
  }

  const { data, error } = await db.rpc('get_participant_by_token', {
    p_token: token
  });

  if (error) {
    message.textContent = 'Не удалось загрузить вашу ссылку. Попробуйте обновить страницу или обратитесь к Виктории.';
    button.textContent = 'Не удалось загрузить';
    console.error(error);
    return;
  }

  if (!data || !data.name) {
    message.textContent = 'Такая персональная ссылка не найдена. Проверьте её или обратитесь к Виктории.';
    button.textContent = 'Ссылка не найдена';
    return;
  }

  participantName = data.name;

  document.getElementById('welcome').textContent =
    participantName + ', для вас есть подарок!';

  if (data.prize) {
    showPrize(data.prize, data.description);
    return;
  }

  button.disabled = false;
  button.textContent = 'Крутить колесо!';
}

async function spin() {
  if (busy || !token || !prizes.length) return;

  busy = true;
  button.disabled = true;
  button.textContent = 'Колесо вращается...';
  message.textContent = '';

  const { error: drawError } = await db.rpc('draw_prize', {
    p_token: token
  });

  if (drawError) {
    message.textContent = 'Не удалось определить подарок: ' + drawError.message;
    button.disabled = false;
    button.textContent = 'Попробовать ещё раз';
    busy = false;
    return;
  }

  const { data, error } = await db.rpc('get_participant_by_token', {
    p_token: token
  });

  if (error || !data || !data.prize) {
    message.textContent = 'Подарок закреплён, но не удалось показать результат. Обновите страницу.';
    button.textContent = 'Обновить страницу';
    button.disabled = false;
    button.onclick = () => location.reload();
    busy = false;
    return;
  }

  const index = findPrizeIndex(data);

  if (index < 0) {
    message.textContent = 'Подарок закреплён, но его не удалось сопоставить с сектором колеса. Результат сохранён — обратитесь к Виктории.';
    button.textContent = 'Результат сохранён';
    busy = false;
    return;
  }

  const slice = Math.PI * 2 / prizes.length;
  const centerAngle = -Math.PI / 2 + (index + 0.5) * slice;
  const targetRotation = -Math.PI / 2 - centerAngle;
  const fullTurns = 6 * Math.PI * 2;

  canvas.style.transform =
    'rotate(' + (fullTurns + targetRotation) + 'rad)';

  setTimeout(() => {
    showPrize(data.prize, data.description);
    busy = false;
  }, 5200);
}

drawWheel();
