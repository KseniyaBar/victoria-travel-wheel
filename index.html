<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Колесо путешествий — Виктория Герасимова</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  padding: 28px 16px 45px;
  font-family: Arial, sans-serif;
  color: #24464b;
  text-align: center;
  background: linear-gradient(145deg,#e3f4ef,#fff6e8);
}
header { margin-bottom: 24px; }
header h1 { font-size: 27px; margin: 8px 0; color: #24666a; }
header p { margin: 0; color: #668184; }
.decor { font-size: 30px; letter-spacing: 9px; }
.card {
  max-width: 540px;
  margin: 0 auto;
  padding: 26px 20px;
  background: #ffffff;
  border-radius: 24px;
  box-shadow: 0 12px 35px #24464b16;
}
h2 { color: #24666a; margin: 0 0 12px; }
#welcome { font-size: 23px; font-weight: bold; margin: 18px 0 8px; }
#instruction { color: #71878a; line-height: 1.5; }
.wheel-wrap {
  width: min(100%, 390px);
  aspect-ratio: 1;
  position: relative;
  margin: 25px auto;
}
canvas {
  display: block;
  width: 100%;
  height: 100%;
  border-radius: 50%;
  transition: transform 5s cubic-bezier(.12,.75,.12,1);
  filter: drop-shadow(0 7px 8px #24464b25);
}
.pointer {
  position: absolute;
  z-index: 2;
  top: -9px;
  left: 50%;
  transform: translateX(-50%);
  width: 0;
  height: 0;
  border-left: 17px solid transparent;
  border-right: 17px solid transparent;
  border-top: 34px solid #d58b43;
  filter: drop-shadow(0 2px 2px #0002);
}
.center {
  position: absolute;
  z-index: 1;
  width: 66px;
  height: 66px;
  border-radius: 50%;
  background: #fff;
  border: 7px solid #e5bd7c;
  top: 50%;
  left: 50%;
  transform: translate(-50%,-50%);
  box-shadow: 0 2px 8px #0002;
}
button {
  border: 0;
  border-radius: 14px;
  padding: 16px 30px;
  color: white;
  background: #287c78;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
}
button:disabled { opacity: .55; cursor: not-allowed; }
#result {
  display: none;
  margin: 22px 0 8px;
  padding: 20px;
  border-radius: 16px;
  background: #f1f8f3;
}
#result h2 { font-size: 25px; }
#prizeName { font-size: 23px; font-weight: bold; color: #b87936; }
#prizeDescription { color: #668184; margin-top: 8px; }
#message { margin: 15px 0; color: #a34242; line-height: 1.5; }
.thanks { margin-top: 22px; color: #668184; }
footer { margin-top: 22px; font-size: 13px; color: #8a9c9b; }
@media(max-width:420px) {
  header h1 { font-size: 23px; }
  .card { padding: 22px 14px; }
}
</style>
</head>
<body>

<header>
  <div class="decor">✈️ 🌴 🧳</div>
  <h1>Турагент Виктория Герасимова</h1>
  <p>Ваши путешествия — моя забота</p>
</header>

<main class="card">
  <div id="welcome">Для вас есть подарок!</div>
  <p id="instruction">Нажмите на кнопку и узнайте, какой сюрприз вас ждёт!</p>

  <div class="wheel-wrap">
    <div class="pointer"></div>
    <canvas id="wheel" width="600" height="600"></canvas>
    <div class="center"></div>
  </div>

  <button id="spinButton" disabled>Загрузка...</button>
  <div id="message"></div>

  <section id="result">
    <h2>Ваш подарок!</h2>
    <div id="prizeName"></div>
    <div id="prizeDescription"></div>
  </section>

  <p class="thanks">Спасибо, что путешествуете со мной!</p>
</main>

<footer>С любовью к путешествиям ❤️</footer>

<script>
const SUPABASE_URL = 'https://qvlxuzvltcqjxlsqboip.supabase.co';
const SUPABASE_KEY = 'sb_publishable_yQycydwZXHu69680pGjhMg_kvKvsrGo';

const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const colors = ['#f1c47c','#8fc9bd','#f1a58d','#a9b9df','#e6c1d5',
                '#b7d7a8','#e8b9a5','#a8cbd5','#d9c4e8','#f0d58c'];

const canvas = document.getElementById('wheel');
const ctx = canvas.getContext('2d');
const button = document.getElementById('spinButton');
const message = document.getElementById('message');
const result = document.getElementById('result');

const token = new URLSearchParams(location.search).get('token');

let participantName = '';
let prizes = [];
let busy = false;

function getField(item, ...keys) {
  for (const key of keys) {
    if (item && item[key] !== undefined && item[key] !== null) return item[key];
  }
  return '';
}

// Для сертификатов на колесе показываем общее название,
// а эмодзи помогает отличить один сертификат от другого.
function getWheelLabel(prize) {
  const originalName = String(prize.name || '').trim();
  const normalized = originalName.toLocaleLowerCase('ru');

  if (normalized.includes('ozon')) {
    return { name: 'Сертификат', emoji: '🛍️' };
  }
  if (normalized.includes('золот') || normalized.includes('golden')) {
    return { name: 'Сертификат', emoji: '💄' };
  }
  if (String(prize.description || '').toLocaleLowerCase('ru').includes('сертификат')) {
    return { name: 'Сертификат', emoji: prize.emoji || '🎁' };
  }

  return { name: originalName, emoji: prize.emoji || '🎁' };
}

function normalizePrize(item) {
  return {
    name: String(getField(item, 'name', 'prize_name')),
    description: String(getField(item, 'description', 'prize_description')),
    emoji: String(getField(item, 'emoji', 'prize_emoji') || '🎁')
  };
}

function drawWheel() {
  const cx = 300, cy = 300, radius = 285;
  ctx.clearRect(0, 0, 600, 600);

  if (!prizes.length) {
    ctx.beginPath();
    ctx.arc(cx, cy, radius, 0, Math.PI * 2);
    ctx.fillStyle = '#e8f1ef';
    ctx.fill();
    ctx.fillStyle = '#668184';
    ctx.textAlign = 'center';
    ctx.font = '20px Arial';
    ctx.fillText('Подарки загружаются', cx, cy);
    return;
  }

  const angle = Math.PI * 2 / prizes.length;

  prizes.forEach((prize, i) => {
    const start = -Math.PI / 2 + i * angle;
    const end = start + angle;

    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.arc(cx, cy, radius, start, end);
    ctx.closePath();
    ctx.fillStyle = colors[i % colors.length];
    ctx.fill();
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 5;
    ctx.stroke();

    // Текст и эмодзи остаются горизонтальными независимо от положения сектора.
    const middle = start + angle / 2;
    const labelRadius = prizes.length <= 5 ? 178 : 190;
    const x = cx + Math.cos(middle) * labelRadius;
    const y = cy + Math.sin(middle) * labelRadius;
    const label = getWheelLabel(prize);

    ctx.save();
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    const emojiSize = prizes.length > 8 ? 26 : 32;
const textSize = prizes.length > 8 ? 17 : (prizes.length > 6 ? 19 : 22);
    
    ctx.font = `${emojiSize}px Arial`;
    ctx.fillText(label.emoji, x, y - 17);

ctx.fillStyle = '#29464a';
ctx.font = `bold ${textSize}px Arial`;
ctx.fillText(label.name, x, y + 17, prizes.length > 7 ? 110 : 135);
    ctx.restore();
  });

  ctx.beginPath();
  ctx.arc(cx, cy, radius, 0, Math.PI * 2);
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 7;
  ctx.stroke();
}

function showPrize(prizeName, description) {
  document.getElementById('prizeName').textContent = prizeName || 'Ваш подарок';
  document.getElementById('prizeDescription').textContent = description || '';
  result.style.display = 'block';
  button.disabled = true;
  button.textContent = 'Подарок уже получен';
  document.getElementById('instruction').textContent =
    'Ваш сюрприз уже определён. Спасибо за участие!';
}

async function loadWheelPrizes() {
  const { data, error } = await db.rpc('get_wheel_prizes');

  if (error) {
    console.error('Ошибка загрузки подарков:', error);
    throw new Error('Не удалось загрузить список подарков. Обновите страницу или обратитесь к Виктории.');
  }

  let list = data;
  if (typeof list === 'string') {
    try { list = JSON.parse(list); } catch { list = []; }
  }

  if (!Array.isArray(list)) {
    throw new Error('Список подарков пришёл в неожиданном формате. Обратитесь к Виктории.');
  }

  prizes = list.map(normalizePrize).filter(prize => prize.name);
  if (!prizes.length) {
    throw new Error('Пока нет активных подарков. Обратитесь к Виктории.');
  }

  drawWheel();
}

function findPrizeIndex(data) {
  const prizeName = String(data.prize || '').trim().toLocaleLowerCase('ru');
  const description = String(data.description || '').trim().toLocaleLowerCase('ru');
  const emoji = String(data.emoji || '').trim();

  // Сначала ищем точное совпадение названия и описания — это важно,
  // если в списке есть несколько одинаковых названий подарков.
  let index = prizes.findIndex(prize =>
    prize.name.trim().toLocaleLowerCase('ru') === prizeName &&
    prize.description.trim().toLocaleLowerCase('ru') === description
  );

  if (index < 0 && emoji) {
    index = prizes.findIndex(prize =>
      prize.name.trim().toLocaleLowerCase('ru') === prizeName &&
      prize.emoji === emoji
    );
  }

  if (index < 0) {
    index = prizes.findIndex(prize =>
      prize.name.trim().toLocaleLowerCase('ru') === prizeName
    );
  }

  return index;
}

async function loadParticipant() {
  if (!token) {
    message.textContent = 'Персональная ссылка не найдена. Пожалуйста, обратитесь к Виктории за вашей ссылкой.';
    button.textContent = 'Нет персональной ссылки';
    return;
  }

  try {
    await loadWheelPrizes();
  } catch (error) {
    message.textContent = error.message;
    button.textContent = 'Не удалось загрузить подарки';
    return;
  }

  const { data, error } = await db.rpc('get_participant_by_token', {
    p_token: token
  });

  if (error) {
    message.textContent = 'Не удалось загрузить вашу ссылку. Попробуйте обновить страницу или обратитесь к Виктории.';
    button.textContent = 'Не удалось загрузить';
    console.error(error);
    return;
  }

  if (!data || !data.name) {
    message.textContent = 'Такая персональная ссылка не найдена. Проверьте её или обратитесь к Виктории.';
    button.textContent = 'Ссылка не найдена';
    return;
  }

  participantName = data.name;
  document.getElementById('welcome').textContent =
    participantName + ', для вас есть подарок!';

  if (data.prize) {
    showPrize(data.prize, data.description);
    return;
  }

  button.disabled = false;
  button.textContent = 'Крутить колесо!';
}

async function spin() {
  if (busy || !token || !prizes.length) return;

  busy = true;
  button.disabled = true;
  button.textContent = 'Колесо вращается...';
  message.textContent = '';

  const { error: drawError } = await db.rpc('draw_prize', {
    p_token: token
  });

  if (drawError) {
    message.textContent = 'Не удалось определить подарок: ' + drawError.message;
    button.disabled = false;
    button.textContent = 'Попробовать ещё раз';
    busy = false;
    return;
  }

  const { data, error } = await db.rpc('get_participant_by_token', {
    p_token: token
  });

  if (error || !data || !data.prize) {
    message.textContent = 'Подарок закреплён, но не удалось показать результат. Обновите страницу.';
    button.textContent = 'Обновить страницу';
    button.disabled = false;
    button.onclick = () => location.reload();
    busy = false;
    return;
  }

  const index = findPrizeIndex(data);

  if (index < 0) {
    message.textContent = 'Подарок закреплён, но его не удалось сопоставить с сектором колеса. Результат сохранён — обратитесь к Виктории.';
    button.textContent = 'Результат сохранён';
    busy = false;
    return;
  }

  const slice = Math.PI * 2 / prizes.length;
  const centerAngle = -Math.PI / 2 + (index + 0.5) * slice;
  const targetRotation = -Math.PI / 2 - centerAngle;
  const fullTurns = 6 * Math.PI * 2;

  canvas.style.transform =
    'rotate(' + (fullTurns + targetRotation) + 'rad)';

  setTimeout(() => {
    showPrize(data.prize, data.description);
    busy = false;
  }, 5200);
}

drawWheel();
button.addEventListener('click', spin);
loadParticipant();
</script>
</body>
</html>
